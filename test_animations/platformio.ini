[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    fastled/FastLED@^3.7.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; Uncomment below if you have a specific ESP32 variant
; board = esp32-s3-devkitc-1
; board = esp32-c3-devkitm-1
