[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload settings
upload_speed = 921600

; Library dependencies
lib_deps =
    fastled/FastLED@^3.7.0

; Filesystem settings for LittleFS
board_build.filesystem = littlefs
board_build.partitions = default.csv

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; Data folder for SPIFFS/LittleFS upload
; This will upload files from the 'data' folder to the ESP32 filesystem
; Run: pio run --target uploadfs
